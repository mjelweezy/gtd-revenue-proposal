  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nk than to tell you.<\u002Fdiv><div><br><\u002Fdiv><div>In the year that's passed since we last spoke about GTD Connect, I've been building a product from nothing at an early-stage startup that is genuinely AI-native. It's shown me how much a small team can build today, and how fast. And it's left me confident that I have more to offer the David Allen Group than when we last spoke.&nbsp;<\u002Fdiv><div><br><\u002Fdiv><div>So when Vince mentioned your ambition to reposition GTD for a new generation, I wanted to speak. The method deserves to reach people who'll never pick up a book, and for the first time there are real ways to do it.<\u002Fdiv><div><br><\u002Fdiv><div>What follows is a high-level view of how I see the opportunity Getting Things Done currently has, and how I'd go about exploring it further. I hope it's worth a longer conversation.<br data-om-id=\"c1c12b5f:27\"><br data-om-id=\"c1c12b5f:28\">— Matthew<\u002Fdiv><\u002Fdiv>\n\n      <div style=\"margin-top:auto; padding-top:30px; display:flex; flex-direction:column; gap:10px;\">\n        \n        \n      <\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The moment and opportunity\" data-screen-label=\"02\" data-speaker-notes=\"The argument is available surface area right now. Left: when each channel arrived, against the three editions. Right: how big each one is today, every figure visible without interaction. The slide says what is available and nothing about what has been done with it.\" style=\"background:#FBF7EE; box-sizing:border-box; padding:76px 110px 72px; display:flex; flex-direction:column; font-family:'Archivo', system-ui, sans-serif;\" data-om-slide-id=\"a1837973\">\n\n  <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:60px;\">\n    <div style=\"font-family:'Barlow Condensed', sans-serif; font-size:26px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:#E85000;\">02 &nbsp;/&nbsp; The moment and oppor  text-wrap:pretty;\">Rest. Sam and I are both exhausted.<\u002Fdiv>\n        <\u002Fdiv>\n        <div data-typing=\"\" style=\"display:none; flex-direction:column; align-self:flex-start; max-width:80%; box-sizing:border-box; padding:15px 20px; border-radius:14px; background:#F5EFE1; border:1px solid #D8CFB9;\">\n          <div style=\"font-family:'JetBrains Mono', monospace; font-size:15px; letter-spacing:0.14em; text-transform:uppercase; color:#B83E00; margin-bottom:9px;\">ChatGTD<\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:7px; height:20px;\">\n            <span style=\"width:8px; height:8px; border-radius:50%; background:#8A8A90; animation:dotPulse 1200ms infinite;\"><\u002Fspan>\n            <span style=\"width:8px; height:8px; border-radius:50%; background:#8A8A90; animation:dotPulse 1200ms 180ms infinite;\"><\u002Fspan>\n            <span style=\"width:8px; height:8px; border-radius:50%; background:#8A8A90; animation:dotPulse 1200ms 360ms infinite;\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-msg=\"a\" style=\"opacity:0; align-self:flex-start; max-width:80%; box-sizing:border-box; padding:15px 20px; border-radius:14px; background:#F5EFE1; border:1px solid #D8CFB9;\">\n          <div style=\"font-family:'JetBrains Mono', monospace; font-size:15px; letter-spacing:0.14em; text-transform:uppercase; color:#B83E00; margin-bottom:7px;\">ChatGTD<\u002Fdiv>\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; line-height:1.4; color:#232323; text-wrap:pretty;\">And anything that has to be true? Budget, flight length, who needs to be able to get there?<\u002Fdiv>\n        <\u002Fdiv>\n        <div data-msg=\"u\" style=\"opacity:0; align-self:flex-end; max-width:80%; box-sizing:border-box; padding:15px 20px; border-radius:14px; background:#232323; border:1px solid #232323;\">\n          <div style=\"font-family:'JetBrains Mono', monospace; font-size:15px; letter-spacing:0.14em; text-trans its behind that one decision.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The framework\" data-screen-label=\"06\" data-speaker-notes=\"Orientation only. Each stage is half a diamond; the dotted lines tie each half to its description. The next two slides take each diamond in turn.\" style=\"background:#FBF7EE; box-sizing:border-box; padding:76px 110px 72px; display:flex; flex-direction:column; font-family:'Archivo', system-ui, sans-serif;\">\n\n  <div style=\"font-family:'Barlow Condensed', sans-serif; font-size:26px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:#E85000;\">06 &nbsp;/&nbsp; The framework<\u002Fdiv>\n\n  <h2 style=\"margin:18px 0 0; max-width:1560px; font-size:44px; line-height:1.14; font-weight:700; letter-spacing:-0.025em; color:#232323; text-wrap:balance;\">The approach I follow for finding and testing new revenue streams.<\u002Fh2>\n\n  <div style=\"flex:1 1 auto; display:flex; align-items:center; min-height:0;\">\n    <div ref=\"{{ oppRef }}\" style=\"position:relative; width:1700px; height:700px;\">\n\n      <svg width=\"1700\" height=\"700\" sc-camel-view-box=\"0 0 1700 700\" style=\"position:absolute; inset:0;\">\n        <polygon data-half=\"discover\" data-stage=\"discover\" points=\"0,200 425,40 425,360\" fill=\"rgba(232,80,0,0)\" style=\"transition:fill 180ms;\"><\u002Fpolygon>\n        <polygon data-half=\"define\" data-stage=\"define\" points=\"425,40 850,200 425,360\" fill=\"rgba(232,80,0,0)\" style=\"transition:fill 180ms;\"><\u002Fpolygon>\n        <polygon data-half=\"develop\" data-stage=\"develop\" points=\"850,200 1275,40 1275,360\" fill=\"rgba(232,80,0,0)\" style=\"transition:fill 180ms;\"><\u002Fpolygon>\n        <polygon data-half=\"deliver\" data-stage=\"deliver\" points=\"1275,40 1700,200 1275,360\" fill=\"rgba(232,80,0,0)\" style=\"transition:fill 180ms;\"><\u002Fpolygon>\n        <polygon points=\"0,200 425,40 850,200 425,360\" fill=\"none\" stroke=\"#232323\" stroke-width=\"2\"><\u002Fpolygon>\n        <polygon points=\"850,200 1275,40 1700,200 1275,360\" fill=\"none\" stroke=\"#232323\" stroke-width=\"2\"><\u002Fpolygon>\n        <line x1=\"425\" y1=\"40\" x2=\"425\" y2=\"360\" stroke=\"#D8CFB9\" stroke-width=\"1.5\" stroke-dasharray=\"5 6\"><\u002Fline>\n        <line x1=\"1275\" y1=\"40\" x2=\"1275\" y2=\"360\" stroke=\"#D8CFB9\" stroke-width=\"1.5\" stroke-dasharray=\"5 6\"><\u002Fline>\n        <line data-drop=\"discover\" x1=\"1\" y1=\"208\" x2=\"1\" y2=\"422\" stroke=\"#C9C0AA\" stroke-width=\"1.5\" stroke-dasharray=\"4 6\" style=\"transition:stroke 180ms;\"><\u002Fline>\n        <line data-drop=\"discover define\" x1=\"425\" y1=\"368\" x2=\"425\" y2=\"422\" stroke=\"#C9C0AA\" stroke-width=\"1.5\" stroke-dasharray=\"4 6\" style=\"transition:stroke 180ms;\"><\u002Fline>\n        <line data-drop=\"define develop\" x1=\"850\" y1=\"208\" x2=\"850\" y2=\"422\" stroke=\"#C9C0AA\" stroke-width=\"1.5\" stroke-dasharray=\"4 6\" style=\"transition:stroke 180ms;\"><\u002Fline>\n        <line data-drop=\"develop deliver\" x1=\"1275\" y1=\"368\" x2=\"1275\" y2=\"422\" stroke=\"#C9C0AA\" stroke-width=\"1.5\" stroke-dasharray=\"4 6\" style=\"transition:stroke 180ms;\"><\u002Fline>\n        <line data-drop=\"deliver\" x1=\"1699\" y1=\"208\" x2=\"1699\" y2=\"422\" stroke=\"#C9C0AA\" stroke-width=\"1.5\" stroke-dasharray=\"4 6\" style=\"transition:stroke 180ms;\"><\u002Fline>\n      <\u002Fsvg>\n\n      <div data-stage=\"discover\" tabindex=\"0\" style=\"position:absolute; left:0px; top:430px; width:425px; box-sizing:border-box; padding:20px 40px 0 28px; border-top:2px solid #D8CFB9; cursor:pointer; outline:none; transition:border-color 180ms;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:15px; letter-spacing:0.16em; color:#E85000;\">01<\u002Fdiv>\n        <div style=\"margin-top:10px; font-family:'Barlow Condensed', sans-serif; font-size:36px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:#232323; line-height:1.05;\">Discover<\u002Fdiv>\n        <div style=\"margin-top:12px; font-family:'Archivo', sans-serif; font-size:20px; line-height:1.5; color:#4E4E52; text-wrap:pretty;\">I'll help the David Allen Group understand the opportunity space.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-stage=\"define\" tabindex=\"0\" style=\"position:absolute; left:425px; top:430px; width:425px; box-sizing:border-box; padding:20px 40px 0 28px; border-top:2px solid #D8CFB9; cursor:pointer; outline:none; transition:border-color 180ms;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:15px; letter-spacing:0.16em; color:#E85000;\">02<\u002Fdiv>\n        <div style=\"margin-top:10px; font-family:'Barlow Condensed', sans-serif; font-size:36px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:#232323; line-height:1.05;\">Define<\u002Fdiv>\n        <div style=\"margin-top:12px; font-family:'Archivo', sans-serif; font-size:20px; line-height:1.5; color:#4E4E52; text-wrap:pretty;\">I'll bring back clear, prioritised opportunities for us to weigh up together.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-stage=\"develop\" tabindex=\"0\" style=\"position:absolute; left:850px; top:430px; width:425px; box-sizing:border-box; padding:20px 40px 0 28px; border-top:2px solid #D8CFB9; cursor:pointer; outline:none; transition:border-color 180ms;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:15px; letter-spacing:0.16em; color:#E85000;\">03<\u002Fdiv>\n        <div style=\"margin-top:10px; font-family:'Barlow Condensed', sans-serif; font-size:36px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:#232323; line-height:1.05;\">Develop<\u002Fdiv>\n        <div style=\"margin-top:12px; font-family:'Archivo', sans-serif; font-size:20px; line-height:1.5; color:#4E4E52; text-wrap:pretty;\">I'll build potential solutions roughly and test them cheaply.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-stage=\"deliver\" tabindex=\"0\" style=\"position:absolute; left:1275px; top:430px; width:425px; box-sizing:border-box; padding:20px 40px 0 28px; border-top:2px solid #D8CFB9; cursor:pointer; outline:none; transition:border-color 180ms;\">\n        <div style=\"font-family:'JetBrains Mono', monospace; font-size:15px; letter-spacing:0.16em; color:#E85000;\">04<\u002Fdiv>\n        <div style=\"margin-top:10px; font-family:'Barlow Condensed', sans-serif; font-size:36px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:#232323; line-height:1.05;\">Deliver<\u002Fdiv>\n        <div style=\"margin-top:12px; font-family:'Archivo', sans-serif; font-size:20px; line-height:1.5; color:#4E4E52; text-wrap:pretty;\">I'll prove what works, and bring you the evidence.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Discover &amp; Define\" data-screen-label=\"07\" data-speaker-notes=\"The first diamond, at the same scale as the framework slide. Discover opens the problem space up; Define narrows it to one problem statement. Three months buys that statement and a decision, not a build.\" style=\"background:#FBF7EE; box-sizing:border-box; padding:76px 110px 72px; display:flex; flex-direction:column; font-family:'Archivo', system-ui, sans-serif;\">\n\n  <div style=\"font-family:'Barlow Condensed', sans-serif; font-size:26px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:#E85000;\">07 &nbsp;/&nbsp; Discover &amp; Define<\u002Fdiv>\n\n  <h2 style=\"margin:18px 0 0; max-width:1560px; font-size:44px; line-height:1.14; font-weight:700; letter-spacing:-0.025em; color:#232323; text-wrap:balance;\">The first phase is about understanding the audience, the market, and the opportunity.<\u002Fh2>\n\n  <div style=\"flex:1 1 auto; display:flex; align-items:flex-start; gap:25px; margin-top:34px; min-height:0;\">\n      <div data-list=\"\" style=\"width:535px; flex:0 0 auto; display:flex; flex-direction:column; gap:18px; text-align:left;\">\n        <div style=\"border-bottom:2px solid #232323; padding-bottom:14px;\">\n          <div style=\"font-family:'Barlow Condensed', sans-serif; font-size:40px; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; color:#232323; line-height:1;\">Discover<\u002Fdiv>\n          <div style=\"margin-top:8px; font-family:'JetBrains Mono', monospace; font-size:24px; letter-spacing:0.13em; text-transform:uppercase; color:#8A8A90;\">OPENING UP THE PROBLEM<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">User interviews with practitioners and non-practitioners<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Contextual observation of how people actually run their systems (GTD or otherwise)<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Interviews with GTD coaches and trainers, who see where people fall away<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Market and competitor landscape: productivity tools, the creator ecosystem, AI assistants<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Channel research: where these audiences actually are<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Review of existing customer data, where it exists<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-diamond=\"left\" style=\"flex:1 1 auto; min-width:0; display:flex; justify-content:center; align-items:flex-start; padding-top:71px; transform:scale(0.7); transform-origin:center center;\">\n        <svg width=\"850\" height=\"320\" sc-camel-view-box=\"0 0 850 320\" style=\"display:block; flex:0 0 auto; overflow:visible;\">\n          <g data-ghost=\"\" opacity=\"0\">\n            <polygon points=\"850,160 1275,0 1700,160 1275,320\" fill=\"none\" stroke=\"#232323\" stroke-width=\"2\"><\u002Fpolygon>\n            <line x1=\"1275\" y1=\"0\" x2=\"1275\" y2=\"320\" stroke=\"#D8CFB9\" stroke-width=\"1.5\" stroke-dasharray=\"5 6\"><\u002Fline>\n          <\u002Fg>\n          <polygon points=\"0,160 425,0 850,160 425,320\" fill=\"none\" stroke=\"#232323\" stroke-width=\"2\"><\u002Fpolygon>\n          <line x1=\"425\" y1=\"0\" x2=\"425\" y2=\"320\" stroke=\"#D8CFB9\" stroke-width=\"1.5\" stroke-dasharray=\"5 6\"><\u002Fline>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div data-list=\"\" style=\"width:535px; flex:0 0 auto; display:flex; flex-direction:column; gap:18px; text-align:left;\">\n        <div style=\"border-bottom:2px solid #232323; padding-bottom:14px;\">\n          <div style=\"font-family:'Barlow Condensed', sans-serif; font-size:40px; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; color:#232323; line-height:1;\">Define<\u002Fdiv>\n          <div style=\"margin-top:8px; font-family:'JetBrains Mono', monospace; font-size:24px; letter-spacing:0.13em; text-transform:uppercase; color:#8A8A90;\">NARROWING TO OPPORTUNITIES<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Pattern and affinity analysis across everything gathered<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Experience maps of how people manage their commitments today — practitioners and non-practitioners alike, including the tools they already use<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Well-defined personas, grounded in the research<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Prioritised opportunity areas<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">The test any solution must pass, including that it is recognisably GTD and not a dilution of it<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">One clear problem statement<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-gate=\"\" style=\"flex:0 0 auto; display:flex; align-items:baseline; gap:28px; margin-top:24px; padding-top:22px; border-top:2px solid #232323;\">\n    <div style=\"flex:0 0 auto; font-family:'Barlow Condensed', sans-serif; font-size:26px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#E85000;\">DEFINITION OF DONE<\u002Fdiv>\n    <div style=\"font-family:'Archivo', sans-serif; font-size:26px; line-height:1.35; color:#232323;\">A defined problem space with prioritised opportunities to pursue, and the evidence behind that choice.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Develop &amp; Deliver\" data-screen-label=\"08\" data-speaker-notes=\"The second diamond, same scale and treatment. Develop opens out into rough, cheap tests; Deliver narrows to a recommendation with the evidence behind it.\" style=\"background:#FBF7EE; box-sizing:border-box; padding:76px 110px 72px; display:flex; flex-direction:column; font-family:'Archivo', system-ui, sans-serif;\">\n\n  <div style=\"font-family:'Barlow Condensed', sans-serif; font-size:26px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:#E85000;\">08 &nbsp;/&nbsp; Develop &amp; Deliver<\u002Fdiv>\n\n  <h2 style=\"margin:18px 0 0; max-width:1560px; font-size:44px; line-height:1.14; font-weight:700; letter-spacing:-0.025em; color:#232323; text-wrap:balance;\">The second phase is about turning opportunities into something tested with real people.<\u002Fh2>\n\n  <div style=\"flex:1 1 auto; display:flex; align-items:flex-start; gap:25px; margin-top:34px; min-height:0;\">\n      <div data-list=\"\" style=\"width:535px; flex:0 0 auto; display:flex; flex-direction:column; gap:18px; text-align:left;\">\n        <div style=\"border-bottom:2px solid #232323; padding-bottom:14px;\">\n          <div style=\"font-family:'Barlow Condensed', sans-serif; font-size:40px; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; color:#232323; line-height:1;\">Develop<\u002Fdiv>\n          <div style=\"margin-top:8px; font-family:'JetBrains Mono', monospace; font-size:24px; letter-spacing:0.13em; text-transform:uppercase; color:#8A8A90;\">OPENING UP TO SOLUTIONS<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Concept generation with the team<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Rapid prototypes: real enough to test, not built to last<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Concierge tests, where the experience is run by hand before anything is engineered<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Feasibility spikes on what AI can do reliably enough to ship<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Business model sketches: recurring against one-off<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Small channel pilots<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-diamond=\"right\" style=\"flex:1 1 auto; min-width:0; display:flex; justify-content:center; align-items:flex-start; padding-top:71px; transform:scale(0.7); transform-origin:center center;\">\n        <svg width=\"850\" height=\"320\" sc-camel-view-box=\"0 0 850 320\" style=\"display:block; flex:0 0 auto; overflow:visible;\">\n          <g data-ghost=\"\" opacity=\"0\">\n            <polygon points=\"-850,160 -425,0 0,160 -425,320\" fill=\"none\" stroke=\"#232323\" stroke-width=\"2\"><\u002Fpolygon>\n            <line x1=\"-425\" y1=\"0\" x2=\"-425\" y2=\"320\" stroke=\"#D8CFB9\" stroke-width=\"1.5\" stroke-dasharray=\"5 6\"><\u002Fline>\n          <\u002Fg>\n          <polygon points=\"0,160 425,0 850,160 425,320\" fill=\"none\" stroke=\"#232323\" stroke-width=\"2\"><\u002Fpolygon>\n          <line x1=\"425\" y1=\"0\" x2=\"425\" y2=\"320\" stroke=\"#D8CFB9\" stroke-width=\"1.5\" stroke-dasharray=\"5 6\"><\u002Fline>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div data-list=\"\" style=\"width:535px; flex:0 0 auto; display:flex; flex-direction:column; gap:18px; text-align:left;\">\n        <div style=\"border-bottom:2px solid #232323; padding-bottom:14px;\">\n          <div style=\"font-family:'Barlow Condensed', sans-serif; font-size:40px; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; color:#232323; line-height:1;\">Deliver<\u002Fdiv>\n          <div style=\"margin-top:8px; font-family:'JetBrains Mono', monospace; font-size:24px; letter-spacing:0.13em; text-transform:uppercase; color:#8A8A90;\">NARROWING TO WHAT WORKS<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Value and usability testing with real users<\u002Fdiv>\n        <\u002Fdiv><div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">A pilot with a real audience segment<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">A go-to-market strategy and playbook<\u002Fdiv>\n        <\u002Fdiv>\n        \n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">A build, partner or stop recommendation<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:2px 0 2px 18px; border-left:3px solid #E85000;\">\n          <div style=\"font-family:'Archivo', sans-serif; font-size:24px; font-weight:400; line-height:1.25; color:#4E4E52; text-wrap:pretty;\">Everything ready to build: roadmap, requirements, measurement plan, and the budget it would need.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-gate=\"\" style=\"flex:0 0 auto; display:flex; align-items:baseline; gap:28px; margin-top:24px; padding-top:22px; border-top:2px solid #232323;\">\n    <div style=\"flex:0 0 auto; font-family:'Barlow Condensed', sans-serif; font-size:26px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#E85000;\">DEFINITION OF DONE<\u002Fdiv>\n    <div style=\"font-family:'Archivo', sans-serif; font-size:26px; line-height:1.35; color:#232323;\">A tested recommendation, the evidence behind it, and everything needed to build it.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Timeline\" data-screen-label=\"09\" data-speaker-notes=\"The same diagram as the framework slide, with the six months laid over it. Each half ends in a decision, so nothing runs on assumption.\" style=\"background:#FBF7EE; box-sizing:border-box; padding:76px 110px 72px; display:flex; flex-direction:column; font-family:'Archivo', system-ui, sans-serif;\">\n\n  <div style=\"font-family:'Barlow Condensed', sans-serif; font-size:26px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:#E85000;\">09 &nbsp;/&nbsp; Timeline<\u002Fdiv>\n\n  <h2 style=\"margin:18px 0 0; max-width:1560px; font-size:44px; line-height:1.14; font-weight:700; letter-spacing:-0.025em; color:#232323; text-wrap:balance;\">I propose an initial six months, with a review after month three to decide whether the opportunity is worth pursuing.<\u002Fh2>\n\n  <div style=\"flex:1 1 auto; display:flex; align-items:center; min-height:0;\">\n    <div style=\"position:relative; width:1700px; height:660px;\">\n\n      <svg width=\"1700\" height=\"660\" sc-camel-view-box=\"0 0 1700 660\" style=\"position:absolute; inset:0;\">\n        <polygon points=\"0,200 425,40 850,200 425,360\" fill=\"none\" stroke=\"#232323\" stroke-width=\"2\"><\u002Fpolygon>\n        <polygon points=\"850,200 1275,40 1700,200 1275,360\" fill=\"none\" stroke=\"#232323\" stroke-width=\"2\"><\u002Fpolygon>\n        <line x1=\"1\" y1=\"208\" x2=\"1\" y2=\"452\" stroke=\"#C9C0AA\" stroke-width=\"1.5\" stroke-dasharray=\"4 6\"><\u002Fline>\n        <line x1=\"850\" y1=\"208\" x2=\"850\" y2=\"452\" stroke=\"#C9C0AA\" stroke-width=\"1.5\" stroke-dasharray=\"4 6\"><\u002Fline>\n        <line x1=\"1699\" y1=\"208\" x2=\"1699\" y2=\"452\" stroke=\"#C9C0AA\" stroke-width=\"1.5\" stroke-dasharray=\"4 6\"><\u002Fline>\n      <\u002Fsvg>\n\n      <div style=\"position:absolute; left:0px; top:460px; width:850px; box-sizing:border-box; padding:22px 28px 0; border-top:2px solid #232323;\">\n        <div style=\"font-family:'Barlow Condensed', sans-serif; font-size:44px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:#232323; line-height:1;\">Months 1–3<\u002Fdiv>\n        <div style=\"margin-top:12px; font-family:'JetBrains Mono', monospace; font-size:18px; letter-spacing:0.16em; text-transform:uppercase; color:#8A8A90;\">Discover &amp; Define<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:absolute; left:850px; top:460px; width:850px; box-sizing:border-box; padding:22px 28px 0; border-top:2px solid #232323;\">\n        <div style=\"font-family:'Barlow Condensed', sans-serif; font-size:44px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:#232323; line-height:1;\">Months 4–6<\u002Fdiv>\n        <div style=\"margin-top:12px; font-family:'JetBrains Mono', monospace; font-size:18px; letter-spacing:0.16em; text-transform:uppercase; color:#8A8A90;\">Develop &amp; Deliver<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  \n<\u002Fsection>\n\n<section data-label=\"Questions and next steps\" data-screen-label=\"10\" data-speaker-notes=\"The ask: a conversation.\" style=\"background:#FBF7EE; box-sizing:border-box; padding:100px 110px 80px; display:flex; flex-direction:column; justify-content:center; gap:30px; font-family:'Archivo', system-ui, sans-serif;\" data-om-slide-id=\"fed00e2c\">\n  <div style=\"font-family:'Barlow Condensed', sans-serif; font-size:26px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:#E85000;\">10 &nbsp;/&nbsp; NEXT STEPS<\u002Fdiv>\n  <h2 style=\"margin:0; max-width:1500px; font-size:64px; line-height:1.1; font-weight:700; letter-spacing:-0.028em; color:#232323; text-wrap:balance;\">Thank you for reading.<\u002Fh2>\n  <div style=\"font-family:'JetBrains Mono', monospace; font-size:20px; letter-spacing:0.16em; text-transform:uppercase; color:#8A8A90;\"><\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;animateReveal&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      bandRef: (el) => { this.band = el; },\n      oppRef: (el) => { this.opp = el; },\n      chatRef: (el) => { this.chat = el; },\n    };\n  }\n\n  playDiamond(sec) {\n    if (this.props.animateReveal === false) return;\n    const wrap = sec.querySelector('[data-diamond]');\n    if (!wrap) return;\n    if (this._dTimers) this._dTimers.forEach(clearTimeout);\n    this._dTimers = [];\n\n    // slide 07 arrives from the framework slide at full size, then shrinks\n    // slide 08 picks up where 07 left off: already small, pairs up, slides on\n    const dir = wrap.getAttribute('data-diamond');\n    const carry = dir === 'right';\n    const from = carry ? 595 : -425;\n    const parts = Array.from(sec.querySelectorAll('[data-list], [data-gate]'));\n\n    const ghost = sec.querySelector('[data-ghost]');\n    wrap.style.transition = 'none';\n    wrap.style.transform = 'translateX(' + from + 'px) scale(' + (carry ? 0.7 : 1) + ')';\n    if (ghost) { ghost.style.transition = 'none'; ghost.style.opacity = '1'; }\n    parts.forEach((p) => {\n      p.style.transition = 'none';\n      p.style.opacity = '0';\n      p.style.transform = 'translateY(14px)';\n    });\n\n    this._dTimers.push(setTimeout(() => {\n      void wrap.offsetWidth;\n      wrap.style.transition = 'transform ' + (carry ? 900 : 760) + 'ms cubic-bezier(0.32,0.72,0.24,1)';\n      wrap.style.transform = 'translateX(0) scale(' + (carry ? 0.7 : 1) + ')';\n      if (ghost) {\n        ghost.style.transition = 'opacity ' + (carry ? 760 : 620) + 'ms ease';\n        ghost.style.opacity = '0';\n      }\n    }, 60));\n\n    if (!carry) {\n      this._dTimers.push(setTimeout(() => {\n        wrap.style.transition = 'transform 560ms cubic-bezier(0.32,0.72,0.24,1)';\n        wrap.style.transform = 'translateX(0) scale(0.7)';\n      }, 880));\n    }\n\n    parts.forEach((p, i) => {\n      this._dTimers.push(setTimeout(() => {\n        p.style.transition = 'opacity 420ms ease, transform 420ms cubic-bezier(0.22,0.61,0.36,1)';\n        p.style.opacity = '1';\n        p.style.transform = 'translateY(0)';\n      }, (carry ? 1060 : 1260) + i * 150));\n    });\n  }\n\n  chatIndex() {\n    if (!this.chat) return -1;\n    const sec = this.chat.closest('section');\n    if (!sec || !sec.parentNode) return -1;\n    return Array.prototype.indexOf.call(sec.parentNode.querySelectorAll('section'), sec);\n  }\n\n  playChat() {\n    const root = this.chat;\n    if (!root) return;\n    if (this._chatTimers) this._chatTimers.forEach(clearTimeout);\n    this._chatTimers = [];\n    if (this._typeInt) clearInterval(this._typeInt);\n\n    const nodes = Array.from(root.querySelectorAll('[data-msg], [data-typing]'));\n    nodes.forEach((n) => {\n      n.style.display = 'none';\n      n.style.opacity = '0';\n      n.style.animation = 'none';\n    });\n\n    const welcome = root.querySelector('[data-welcome]');\n    const composer = root.querySelector('[data-composer]');\n    const caret = root.querySelector('[data-caret]');\n    const startBtn = root.querySelector('[data-start]');\n    const PLACEHOLDER = 'How can I help you today?';\n\n    if (welcome) { welcome.style.display = 'flex'; welcome.style.opacity = '1'; }\n    if (composer) { composer.textContent = PLACEHOLDER; composer.style.color = '#8A8A90'; }\n    if (caret) caret.style.display = 'none';\n    if (startBtn) { startBtn.style.opacity = '0'; startBtn.style.pointerEvents = 'none'; }\n    this._chatReady = false;\n    this._typing = false;\n\n    const firstBody = nodes.find((n) => n.hasAttribute('data-msg'));\n    const firstText = firstBody ? (firstBody.querySelectorAll('div')[1] || {}).textContent || '' : '';\n    const STEP = 34;\n\n    this._typing = true;\n    this._typeText = firstText;\n    this._chatTimers.push(setTimeout(() => {\n      if (!composer || !firstText || !this._typing) return;\n      composer.textContent = '';\n      composer.style.color = '#232323';\n      if (caret) caret.style.display = 'block';\n      this._typing = true;\n      this._typeText = firstText;\n      let i = 0;\n      this._typeInt = setInterval(() => {\n        i += 1;\n        composer.textContent = firstText.slice(0, i);\n        if (i < firstText.length) return;\n        this.finishTyping();\n      }, STEP);\n    }, 900));\n  }\n\n  finishTyping() {\n    const root = this.chat;\n    if (!root) return;\n    if (this._typeInt) clearInterval(this._typeInt);\n    this._typing = false;\n    const composer = root.querySelector('[data-composer]');\n    const caret = root.querySelector('[data-caret]');\n    const startBtn = root.querySelector('[data-start]');\n    if (composer && this._typeText) {\n      composer.textContent = this._typeText;\n      composer.style.color = '#232323';\n    }\n    if (caret) caret.style.display = 'none';\n    this._chatReady = true;\n    if (startBtn) { startBtn.style.opacity = '1'; startBtn.style.pointerEvents = 'auto'; }\n  }\n\n  runThread() {\n    const root = this.chat;\n    if (!root || !this._chatReady) return;\n    this._chatReady = false;\n    if (this._chatTimers) this._chatTimers.forEach(clearTimeout);\n    this._chatTimers = [];\n\n    const welcome = root.querySelector('[data-welcome]');\n    const startBtn = root.querySelector('[data-start]');\n    if (startBtn) { startBtn.style.opacity = '0'; startBtn.style.pointerEvents = 'none'; }\n    if (welcome) {\n      welcome.style.opacity = '0';\n      this._chatTimers.push(setTimeout(() => { welcome.style.display = 'none'; }, 400));\n    }\n\n    // pacing derived from reading speed: ~280 wpm on screen, plus a beat to take in each turn\n    const MS_PER_WORD = 215;\n    const wordsOf = (n) => {\n      const body = n.querySelectorAll ? n.querySelectorAll('div')[1] : null;\n      const txt = (body ? body.textContent : n.textContent) || '';\n      return txt.trim() ? txt.trim().split(/\\s+/).length : 0;\n    };\n\n    const nodes = Array.from(root.querySelectorAll('[data-msg], [data-typing]'));\n    let t = 420;\n    let msgSeen = 0;\n    nodes.forEach((n, idx) => {\n      if (n.hasAttribute('data-typing')) {\n        let ahead = 0;\n        for (let j = idx + 1; j < nodes.length; j += 1) {\n          if (nodes[j].hasAttribute('data-msg')) { ahead = wordsOf(nodes[j]); break; }\n        }\n        const at = t;\n        this._chatTimers.push(setTimeout(() => {\n          n.style.display = 'flex';\n          n.style.opacity = '1';\n        }, at));\n        t += Math.min(2800, 800 + ahead * 46);\n        this._chatTimers.push(setTimeout(() => { n.style.display = 'none'; }, t));\n      } else {\n        const at = t;\n        this._chatTimers.push(setTimeout(() => {\n          n.style.display = 'block';\n          n.style.opacity = '1';\n          n.style.animation = 'msgIn 380ms cubic-bezier(0.22,0.61,0.36,1) both';\n        }, at));\n        msgSeen += 1;\n        const factor = msgSeen === 1 ? 0.45 : 1;\n        t += 600 + Math.round(wordsOf(n) * MS_PER_WORD * factor);\n      }\n    });\n  }\n\n  componentDidMount() {\n    const near = (e, sel) => (e.target && e.target.closest ? e.target.closest(sel) : null);\n\n    this._over = (e) => {\n      const ch = near(e, '[data-ch]');\n      if (ch) this.showCh(ch);\n      const arg = near(e, '[data-arg]');\n      if (arg) this.setArg(arg, true);\n      const st = near(e, '[data-stage]');\n      if (st) this.setStage(st.getAttribute('data-stage'), true);\n    };\n    this._out = (e) => {\n      const ch = near(e, '[data-ch]');\n      if (ch && !ch.contains(e.relatedTarget)) this.hideCh(ch);\n      const arg = near(e, '[data-arg]');\n      if (arg && !arg.contains(e.relatedTarget) && !this._allArgs) this.setArg(arg, false);\n      const st = near(e, '[data-stage]');\n      if (st && !st.contains(e.relatedTarget)) this.setStage(st.getAttribute('data-stage'), false);\n    };\n    this._click = (e) => {\n      if (near(e, '[data-chat]')) {\n        if (this._chatReady) this.runThread();\n        else if (this._typing) this.finishTyping();\n        else this.playChat();\n        return;\n      }\n      if (near(e, '[data-toggle]')) { this.toggleArgs(); return; }\n      const arg = near(e, '[data-arg]');\n      if (arg) { this.setArg(arg, true); return; }\n      const ch = near(e, '[data-ch]');\n      if (ch) { if (this._openCh === ch) this.hideCh(ch); else this.showCh(ch); return; }\n      if (this._openCh) this.hideCh(this._openCh);\n    };\n    this._keys = (e) => {\n      if (e.key !== 'Enter' && e.key !== ' ') return;\n      if (near(e, '[data-toggle]')) { e.preventDefault(); this.toggleArgs(); }\n    };\n\n    document.addEventListener('mouseover', this._over, true);\n    document.addEventListener('focusin', this._over, true);\n    document.addEventListener('mouseout', this._out, true);\n    document.addEventListener('focusout', this._out, true);\n    document.addEventListener('click', this._click, true);\n    document.addEventListener('keydown', this._keys, true);\n\n    this._onSlide = (e) => {\n      const i = e && e.detail ? e.detail.index : -1;\n      if (i === 1) this.playReveal();\n      if (i === this.chatIndex()) this.playChat();\n      const secs = document.querySelectorAll('section');\n      if (secs[i] && secs[i].querySelector('[data-diamond]')) this.playDiamond(secs[i]);\n    };\n    document.addEventListener('slidechange', this._onSlide);\n    setTimeout(() => { this.playReveal(); this.playChat(); }, 400);\n  }\n\n  componentWillUnmount() {\n    document.removeEventListener('mouseover', this._over, true);\n    document.removeEventListener('focusin', this._over, true);\n    document.removeEventListener('mouseout', this._out, true);\n    document.removeEventListener('focusout', this._out, true);\n    document.removeEventListener('click', this._click, true);\n    document.removeEventListener('keydown', this._keys, true);\n    document.removeEventListener('slidechange', this._onSlide);\n  }\n\n  showCh(p) {\n    if (this._openCh && this._openCh !== p) this.hideCh(this._openCh);\n    const c = p.querySelector('[data-card]');\n    if (c) {\n      c.style.opacity = '1';\n      c.style.transform = 'translateY(-50%) translateX(0)';\n      c.style.pointerEvents = 'auto';\n    }\n    p.style.borderColor = '#E85000';\n    p.style.zIndex = '50';\n    this._openCh = p;\n  }\n\n  hideCh(p) {\n    const c = p.querySelector('[data-card]');\n    if (c) {\n      const right = c.style.right && c.style.right !== 'auto';\n      c.style.opacity = '0';\n      c.style.transform = 'translateY(-50%) translateX(' + (right ? '8px' : '-8px') + ')';\n      c.style.pointerEvents = 'none';\n    }\n    p.style.borderColor = '#D8CFB9';\n    p.style.zIndex = '';\n    if (this._openCh === p) this._openCh = null;\n  }\n\n  setStage(id, on) {\n    const col = document.querySelector('div[data-stage=\"' + id + '\"]');\n    const poly = document.querySelector('[data-half=\"' + id + '\"]');\n    const drops = document.querySelectorAll('[data-drop~=\"' + id + '\"]');\n    if (col) col.style.borderTopColor = on ? '#E85000' : '#D8CFB9';\n    if (poly) poly.setAttribute('fill', on ? 'rgba(232,80,0,0.1)' : 'rgba(232,80,0,0)');\n    drops.forEach((d) => d.setAttribute('stroke', on ? '#E85000' : '#C9C0AA'));\n  }\n\n  setArg(el, on) {\n    const d = el.querySelector('[data-detail]');\n    if (d) d.style.opacity = on ? '1' : '0';\n  }\n\n  toggleArgs() {\n    this._allArgs = !this._allArgs;\n    const args = Array.from(document.querySelectorAll('[data-arg]'));\n    args.forEach((a) => this.setArg(a, this._allArgs));\n    const btn = document.querySelector('[data-toggle]');\n    const label = document.querySelector('[data-toggle-label]');\n    if (label) {\n      label.textContent = this._allArgs ? 'Hide detail' : 'Show what this makes possible';\n      label.style.color = this._allArgs ? '#FFFFFF' : '#232323';\n    }\n    if (btn) btn.style.background = this._allArgs ? '#E85000' : '#FBF7EE';\n  }\n\n  playReveal() {\n    if (this.props.animateReveal === false) return;\n    const marks = Array.from(document.querySelectorAll('[data-ch]'));\n    if (!marks.length) return;\n    marks\n      .sort((a, b) => parseFloat(a.style.left) - parseFloat(b.style.left))\n      .forEach((p, i) => {\n        p.style.animation = 'none';\n        void p.offsetWidth;\n        p.style.animation = 'riseIn 480ms cubic-bezier(0.22,0.61,0.36,1) both';\n        p.style.animationDelay = (200 + i * 90) + 'ms';\n      });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
